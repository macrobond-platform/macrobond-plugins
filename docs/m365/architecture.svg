<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="921" viewBox="0 0 1200 921"><rect x="0" y="0" width="1200" height="921" fill="#FFFFFF"/><text x="40" y="64" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#15142B">Macrobond MCP in Microsoft 365 Copilot</text><text x="40" y="88" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#56556E">Macrobond Financial AB · Technical architecture</text><g transform="translate(40 116)"><rect x="2" y="2" width="258" height="526" rx="14" stroke-width="1" fill="#F1F1F6" stroke="#D8D8E5"/><text x="22" y="32" font-family="'IBM Plex Mono', Consolas, Menlo, 'Courier New', monospace" font-size="12" font-weight="500" letter-spacing="1" fill="#15142B">YOUR ORGANISATION</text><text x="22" y="52" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#56556E">Network and devices</text><rect x="284" y="2" width="299" height="526" rx="14" stroke-width="1" fill="#ECF0F6" stroke="#D8D8E5"/><text x="304" y="32" font-family="'IBM Plex Mono', Consolas, Menlo, 'Courier New', monospace" font-size="12" font-weight="500" letter-spacing="1" fill="#15142B">MICROSOFT 365 CLOUD</text><text x="304" y="52" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#56556E">Your tenant</text><rect x="607" y="2" width="511" height="526" rx="14" stroke-width="1" fill="#EEEDFF" stroke="#C6C3FF"/><text x="627" y="32" font-family="'IBM Plex Mono', Consolas, Menlo, 'Courier New', monospace" font-size="12" font-weight="500" letter-spacing="1" fill="#15142B">MACROBOND</text><rect x="26" y="82" width="210" height="96" rx="10" stroke-width="1" fill="#FFFFFF" stroke="#D8D8E5"/><text x="46" y="113" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#15142B">Users</text><text x="46" y="137" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#56556E">Copilot in Teams, Outlook</text><text x="46" y="156" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#56556E">or a web browser</text><rect x="26" y="245" width="210" height="96" rx="10" stroke-width="1" fill="#FFFFFF" stroke="#D8D8E5"/><text x="46" y="276" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#15142B">Microsoft 365 admin</text><text x="46" y="300" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#56556E">Uploads the Macrobond app</text><text x="46" y="319" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#56556E">and chooses who gets it</text><rect x="26" y="408" width="210" height="96" rx="10" stroke-width="1" fill="#FFFFFF" stroke="#D8D8E5"/><text x="46" y="439" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#15142B">Browser</text><text x="46" y="463" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#56556E">Opens Macrobond sign-in</text><text x="46" y="482" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#56556E">the first time a user connects</text><rect x="308" y="82" width="251" height="96" rx="10" stroke-width="1" fill="#FFFFFF" stroke="#D8D8E5"/><text x="328" y="113" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#15142B">Microsoft 365 Copilot</text><text x="328" y="137" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#56556E">Runs the conversation and model</text><text x="328" y="156" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#56556E">Shows Macrobond charts and tables</text><rect x="308" y="245" width="251" height="115" rx="10" stroke-width="1" fill="#FFFFFF" stroke="#D8D8E5"/><text x="328" y="276" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#15142B">Macrobond agent</text><text x="328" y="300" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#56556E">Installed from the app package</text><text x="328" y="319" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#56556E">One action: the Macrobond MCP</text><text x="328" y="338" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#56556E">No access to mail or files</text><rect x="308" y="408" width="251" height="96" rx="10" stroke-width="1" fill="#FFFFFF" stroke="#D8D8E5"/><text x="328" y="439" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#15142B">Microsoft token store</text><text x="328" y="463" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#56556E">Keeps each user's</text><text x="328" y="482" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#56556E">Macrobond sign-in token</text><rect x="631" y="82" width="150" height="96" rx="10" stroke-width="1" fill="#FFFFFF" stroke="#C6C3FF"/><text x="651" y="113" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#15142B">Edge network</text><text x="651" y="137" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#56556E">Fastly, HTTPS</text><text x="651" y="156" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#56556E">Nearest server</text><rect x="829" y="82" width="265" height="115" rx="10" stroke-width="1" fill="#FFFFFF" stroke="#C6C3FF"/><text x="849" y="113" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#15142B">Macrobond MCP server</text><text x="849" y="137" font-family="'IBM Plex Mono', Consolas, Menlo, 'Courier New', monospace" font-size="12.5" font-weight="500" fill="#0700FF">platform.macrobond.com/mcp</text><text x="849" y="156" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#56556E">Checks the token on every request</text><text x="849" y="175" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#56556E">Search, data, chart and table tools</text><rect x="829" y="245" width="265" height="96" rx="10" stroke-width="1" fill="#FFFFFF" stroke="#C6C3FF"/><text x="849" y="276" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#15142B">Macrobond Web API</text><text x="849" y="300" font-family="'IBM Plex Mono', Consolas, Menlo, 'Courier New', monospace" font-size="12.5" font-weight="500" fill="#0700FF">api.macrobondfinancial.com</text><text x="849" y="319" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#56556E">Data the user's subscription allows</text><rect x="829" y="408" width="265" height="96" rx="10" stroke-width="1" fill="#FFFFFF" stroke="#C6C3FF"/><text x="849" y="439" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#15142B">Macrobond sign-in</text><text x="849" y="463" font-family="'IBM Plex Mono', Consolas, Menlo, 'Courier New', monospace" font-size="12.5" font-weight="500" fill="#0700FF">apiauth.macrobondfinancial.com</text><text x="849" y="482" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#56556E">Macrobond account, OAuth 2.0</text><path d="M236 113 L302 113" fill="none" stroke-width="2" stroke="#0700FF"/><path d="M308 113 L298 118 L298 108 Z" fill="#0700FF"/><path d="M308 147 L242 147" fill="none" stroke-width="2" stroke="#0700FF"/><path d="M236 147 L246 142 L246 152 Z" fill="#0700FF"/><path d="M559 113 L625 113" fill="none" stroke-width="2" stroke="#0700FF"/><path d="M631 113 L621 118 L621 108 Z" fill="#0700FF"/><path d="M631 147 L565 147" fill="none" stroke-width="2" stroke="#0700FF"/><path d="M559 147 L569 142 L569 152 Z" fill="#0700FF"/><path d="M781 113 L823 113" fill="none" stroke-width="2" stroke="#0700FF"/><path d="M829 113 L819 118 L819 108 Z" fill="#0700FF"/><path d="M829 147 L787 147" fill="none" stroke-width="2" stroke="#0700FF"/><path d="M781 147 L791 142 L791 152 Z" fill="#0700FF"/><path d="M945.5 197 L945.5 239" fill="none" stroke-width="2" stroke="#0700FF"/><path d="M945.5 245 L940.5 235 L950.5 235 Z" fill="#0700FF"/><path d="M977.5 245 L977.5 203" fill="none" stroke-width="2" stroke="#0700FF"/><path d="M977.5 197 L982.5 207 L972.5 207 Z" fill="#0700FF"/><path d="M433.5 178 L433.5 245" fill="none" stroke-width="1.25" stroke="#56556E"/><path d="M433.5 360 L433.5 408" fill="none" stroke-width="1.25" stroke="#56556E"/><path d="M236 293 L302 293" fill="none" stroke-width="1.5" stroke-dasharray="5 4" stroke="#56556E"/><path d="M308 293 L298 298 L298 288 Z" fill="#56556E"/><path d="M131 504 L131 554 L961.5 554 L961.5 510" fill="none" stroke-width="2" stroke="#A9500C"/><path d="M961.5 504 L966.5 514 L956.5 514 Z" fill="#A9500C"/><path d="M829 456 L565 456" fill="none" stroke-width="2" stroke="#A9500C"/><path d="M559 456 L569 451 L569 461 Z" fill="#A9500C"/><text x="443.5" y="215.5" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#56556E">uses the agent's tools</text><text x="443.5" y="388" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#56556E">adds the user's token</text><text x="272" y="284" font-family="'IBM Plex Mono', Consolas, Menlo, 'Courier New', monospace" font-size="11" font-weight="500" text-anchor="middle" letter-spacing="0.9" fill="#56556E">SETUP</text><circle cx="272" cy="113" r="11" fill="#0700FF"/><text x="272" y="117" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">1</text><circle cx="595" cy="113" r="11" fill="#0700FF"/><text x="595" y="117" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">4</text><circle cx="595" cy="147" r="11" fill="#0700FF"/><text x="595" y="151" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">6</text><circle cx="945.5" cy="221" r="11" fill="#0700FF"/><text x="945.5" y="225" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">5</text><circle cx="546.3" cy="554" r="11" fill="#A9500C"/><text x="546.3" y="558" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">2</text><circle cx="694" cy="456" r="11" fill="#A9500C"/><text x="694" y="460" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">3</text></g><path d="M40 712 H72" stroke-width="2" stroke="#0700FF"/><text x="82" y="717" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#56556E">Data requests and results</text><path d="M257.5 712 H289.5" stroke-width="2" stroke="#A9500C"/><text x="299.5" y="717" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#56556E">Sign-in, the first time a user connects</text><path d="M539.9 712 H571.9" stroke-width="1.5" stroke-dasharray="5 4" stroke="#56556E"/><text x="581.9" y="717" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#56556E">One-time setup</text><text x="701.8" y="717" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#56556E">All connections use HTTPS</text><circle cx="51" cy="748" r="10.25" stroke-width="1.5" stroke-dasharray="3 2" fill="#FFFFFF" stroke="#56556E"/><text x="51" y="752" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#56556E">S</text><text x="74" y="753" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#15142B">Admin uploads the Macrobond app</text><circle cx="433.7" cy="748" r="11" fill="#0700FF"/><text x="433.7" y="752" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">1</text><text x="456.7" y="753" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#15142B">User asks the Macrobond agent in Copilot</text><circle cx="816.3" cy="748" r="11" fill="#A9500C"/><text x="816.3" y="752" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">2</text><text x="839.3" y="753" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#15142B">First time only: user signs in to Macrobond in the</text><text x="839.3" y="773" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#15142B">browser</text><circle cx="51" cy="802" r="11" fill="#A9500C"/><text x="51" y="806" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">3</text><text x="74" y="807" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#15142B">Microsoft keeps the user's Macrobond token</text><circle cx="433.7" cy="802" r="11" fill="#0700FF"/><text x="433.7" y="806" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">4</text><text x="456.7" y="807" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#15142B">Copilot calls the MCP server from Microsoft's cloud,</text><text x="456.7" y="827" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#15142B">with the token</text><circle cx="816.3" cy="802" r="11" fill="#0700FF"/><text x="816.3" y="806" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">5</text><text x="839.3" y="807" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#15142B">MCP server checks the token and gets the data from</text><text x="839.3" y="827" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#15142B">the Web API</text><circle cx="51" cy="856" r="11" fill="#0700FF"/><text x="51" y="860" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">6</text><text x="74" y="861" font-family="'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#15142B">Results return to Copilot as a picker, chart or table</text></svg>